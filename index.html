<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Processador de Relatório Financeiro — MediQuo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Bibliotecas externas via CDN -->
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.4/jspdf.plugin.autotable.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cor-primaria: #491e9c;
      --cor-primaria-hover: #5e2dbd;
      --cor-primaria-light: #6b3ec4;
      --cor-fundo: #f5f5f7;
      --cor-card: #ffffff;
      --cor-texto: #1a1a2e;
      --cor-texto-sec: #6b7280;
      --cor-borda: #e5e7eb;
      --cor-sucesso: #10b981;
      --cor-erro: #ef4444;
      --cor-aviso: #f59e0b;
      --radius-card: 12px;
      --radius-btn: 8px;
      --sombra-card: 0 1px 3px rgba(0,0,0,.06), 0 4px 12px rgba(0,0,0,.04);
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background: var(--cor-fundo);
      color: var(--cor-texto);
      line-height: 1.6;
      min-height: 100vh;
    }

    .header {
      background: var(--cor-primaria);
      color: #fff;
      padding: 1.25rem 1.5rem;
      display: flex;
      align-items: center;
      gap: .75rem;
    }
    .header-icon {
      width: 36px; height: 36px;
      background: rgba(255,255,255,.15);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.25rem;
      flex-shrink: 0;
    }
    .header h1 { font-size: 1.1rem; font-weight: 600; letter-spacing: -.01em; }
    .header p { font-size: .78rem; opacity: .8; font-weight: 400; }

    .container { max-width: 800px; margin: 0 auto; padding: 1.5rem 1rem 3rem; }

    .upload-zone {
      background: var(--cor-card);
      border: 2px dashed var(--cor-borda);
      border-radius: var(--radius-card);
      padding: 2.5rem 1.5rem;
      text-align: center;
      cursor: pointer;
      transition: border-color .2s, background .2s;
      box-shadow: var(--sombra-card);
    }
    .upload-zone:hover, .upload-zone.drag-over {
      border-color: var(--cor-primaria);
      background: #f3eefe;
    }
    .upload-zone .icon { font-size: 2.5rem; margin-bottom: .75rem; }
    .upload-zone .label { font-weight: 600; font-size: 1rem; color: var(--cor-texto); margin-bottom: .35rem; }
    .upload-zone .sublabel { font-size: .82rem; color: var(--cor-texto-sec); }
    .upload-zone .sublabel span { color: var(--cor-primaria); font-weight: 600; text-decoration: underline; cursor: pointer; }
    .upload-zone input[type="file"] { display: none; }

    .card {
      background: var(--cor-card);
      border-radius: var(--radius-card);
      box-shadow: var(--sombra-card);
      padding: 1.25rem 1.5rem;
      margin-top: 1rem;
    }
    .card-title {
      font-size: .85rem; font-weight: 700; color: var(--cor-primaria);
      text-transform: uppercase; letter-spacing: .04em; margin-bottom: .75rem;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: .75rem; margin-bottom: 1rem;
    }
    .metric-box {
      background: var(--cor-fundo); border-radius: 8px;
      padding: .85rem; text-align: center;
    }
    .metric-box .value { font-size: 1.35rem; font-weight: 700; color: var(--cor-primaria); line-height: 1.2; }
    .metric-box .label { font-size: .72rem; color: var(--cor-texto-sec); font-weight: 500; margin-top: .2rem; }

    .prof-list {
      list-style: none;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: .4rem .75rem;
    }
    .prof-list li {
      font-size: .82rem; color: var(--cor-texto);
      padding: .3rem 0; border-bottom: 1px solid var(--cor-fundo);
      display: flex; align-items: center; gap: .4rem;
    }
    .prof-list li::before {
      content: ''; width: 6px; height: 6px;
      background: var(--cor-primaria); border-radius: 50%; flex-shrink: 0;
    }

    .actions { display: flex; flex-wrap: wrap; gap: .75rem; margin-top: 1.25rem; }
    .btn {
      display: inline-flex; align-items: center; gap: .5rem;
      padding: .75rem 1.25rem; border: none; border-radius: var(--radius-btn);
      font-family: inherit; font-size: .88rem; font-weight: 600;
      cursor: pointer; transition: background .2s, transform .1s;
      flex: 1; justify-content: center; min-width: 220px;
    }
    .btn:active { transform: scale(.98); }
    .btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
    .btn-primary { background: var(--cor-primaria); color: #fff; }
    .btn-primary:hover:not(:disabled) { background: var(--cor-primaria-hover); }
    .btn-secondary { background: var(--cor-texto); color: #fff; }
    .btn-secondary:hover:not(:disabled) { background: #2d2d4a; }

    .feedback {
      margin-top: 1rem; padding: .75rem 1rem; border-radius: var(--radius-btn);
      font-size: .82rem; font-weight: 500; display: none;
    }
    .feedback.info { background: #ede9fe; color: var(--cor-primaria); display: flex; align-items: center; gap: .5rem; }
    .feedback.success { background: #d1fae5; color: #065f46; display: flex; align-items: center; gap: .5rem; }
    .feedback.error { background: #fee2e2; color: #991b1b; display: flex; align-items: center; gap: .5rem; }

    .progress-bar-container {
      width: 100%; height: 6px; background: #e5e7eb;
      border-radius: 3px; overflow: hidden; margin-top: .5rem; display: none;
    }
    .progress-bar {
      height: 100%; background: var(--cor-primaria);
      border-radius: 3px; transition: width .3s ease; width: 0%;
    }

    .hidden { display: none !important; }
    .spinner {
      width: 16px; height: 16px;
      border: 2px solid currentColor; border-right-color: transparent;
      border-radius: 50%; animation: spin .6s linear infinite; flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .reset-link {
      font-size: .78rem; color: var(--cor-primaria); cursor: pointer;
      text-decoration: underline; font-weight: 500; display: inline-block; margin-top: .5rem;
    }

    @media (max-width: 600px) {
      .header h1 { font-size: .95rem; }
      .container { padding: 1rem .75rem 2rem; }
      .upload-zone { padding: 1.5rem 1rem; }
      .metrics { grid-template-columns: repeat(2, 1fr); }
      .prof-list { grid-template-columns: 1fr; }
      .actions { flex-direction: column; }
      .btn { min-width: unset; }
    }
  </style>
</head>
<body>

  <header class="header">
    <div class="header-icon">📊</div>
    <div>
      <h1>Processador de Relatório Financeiro</h1>
      <p>MediQuo — Pega Plantão</p>
    </div>
  </header>

  <main class="container">
    <div class="upload-zone" id="uploadZone">
      <div class="icon">📁</div>
      <div class="label">Arraste o arquivo .xlsx aqui</div>
      <div class="sublabel">ou <span id="uploadBtn">clique para selecionar</span></div>
      <input type="file" id="fileInput" accept=".xlsx,.xls">
    </div>

    <section id="previewSection" class="hidden">
      <div class="card">
        <div class="card-title">Resumo do relatório</div>
        <div class="metrics">
          <div class="metric-box">
            <div class="value" id="metVigencia">—</div>
            <div class="label">Vigência</div>
          </div>
          <div class="metric-box">
            <div class="value" id="metProfs">—</div>
            <div class="label">Profissionais</div>
          </div>
          <div class="metric-box">
            <div class="value" id="metPlantoes">—</div>
            <div class="label">Plantões</div>
          </div>
          <div class="metric-box">
            <div class="value" id="metHoras">—</div>
            <div class="label">Horas totais</div>
          </div>
          <div class="metric-box">
            <div class="value" id="metValor">—</div>
            <div class="label">Valor total</div>
          </div>
        </div>
        <span class="reset-link" id="resetBtn">← Enviar outro arquivo</span>
      </div>

      <div class="card">
        <div class="card-title">Profissionais detectados</div>
        <ul class="prof-list" id="profList"></ul>
      </div>

      <div class="actions">
        <button class="btn btn-primary" id="btnDia" disabled>
          📊&ensp;Baixar Relatório por Dia (.xlsx)
        </button>
        <button class="btn btn-primary" id="btnProf" disabled>
          📋&ensp;Baixar Relatório por Profissional (.xlsx)
        </button>
        <button class="btn btn-secondary" id="btnIndiv" disabled>
          📁&ensp;Baixar Relatórios Individuais (.zip)
        </button>
      </div>

      <div class="feedback" id="feedback"></div>
      <div class="progress-bar-container" id="progressContainer">
        <div class="progress-bar" id="progressBar"></div>
      </div>
    </section>
  </main>

  <script>
  (function () {
    'use strict';

    // ============================================================
    //  REFERÊNCIAS DOM
    // ============================================================
    const uploadZone     = document.getElementById('uploadZone');
    const fileInput      = document.getElementById('fileInput');
    const uploadBtn      = document.getElementById('uploadBtn');
    const previewSection = document.getElementById('previewSection');
    const resetBtn       = document.getElementById('resetBtn');
    const btnDia         = document.getElementById('btnDia');
    const btnProf        = document.getElementById('btnProf');
    const btnIndiv       = document.getElementById('btnIndiv');
    const feedbackEl     = document.getElementById('feedback');
    const progressCont   = document.getElementById('progressContainer');
    const progressBar    = document.getElementById('progressBar');

    let dadosRelatorio = null;

    // ============================================================
    //  UTILITÁRIOS
    // ============================================================

    /** Formata valor para moeda brasileira: R$ 1.234,00 */
    function formatarMoeda(valor) {
      return 'R$ ' + Number(valor).toLocaleString('pt-BR', {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });
    }

    /** Formata vigência "DD/MM/AAAA~DD/MM/AAAA" → "DD-MM a DD-MM" */
    function formatarVigenciaCurta(vigStr) {
      const partes = vigStr.split('~');
      if (partes.length !== 2) return vigStr;
      const ini = partes[0].trim();
      const fim = partes[1].trim();
      const iniCurto = ini.substring(0, 5).replace(/\//g, '-');
      const fimCurto = fim.substring(0, 5).replace(/\//g, '-');
      return iniCurto + ' a ' + fimCurto;
    }

    /** Converte "HH:MM" em horas decimais (ex: "03:00" → 3, "01:30" → 1.5) */
    function duracaoParaHorasDecimal(dur) {
      if (!dur || typeof dur !== 'string') return 0;
      const parts = dur.split(':');
      if (parts.length !== 2) return 0;
      const h = parseInt(parts[0], 10) || 0;
      const m = parseInt(parts[1], 10) || 0;
      return h + m / 60;
    }

    /** Formata total de horas como "X horas" ou "X,Y horas" (pt-BR) */
    function formatarTotalHoras(horas) {
      if (Number.isInteger(horas)) {
        return horas + ' horas';
      }
      // Usa vírgula como separador decimal (pt-BR)
      return horas.toLocaleString('pt-BR', {
        minimumFractionDigits: 0,
        maximumFractionDigits: 1
      }) + ' horas';
    }

    /** Extrai apenas a data "DD/MM/AAAA" de "DD/MM/AAAA HH:MM" */
    function extrairData(dataHora) {
      return dataHora ? dataHora.substring(0, 10) : '';
    }

    /** Converte "DD/MM/AAAA" para Date sortável */
    function dataParaSort(dataStr) {
      const p = dataStr.split('/');
      return new Date(parseInt(p[2]), parseInt(p[1]) - 1, parseInt(p[0]));
    }

    function mostrarFeedback(msg, tipo) {
      feedbackEl.className = 'feedback ' + tipo;
      const iconMap = { info: '⏳', success: '✅', error: '❌' };
      feedbackEl.innerHTML = (tipo === 'info' ? '<div class="spinner"></div>' : (iconMap[tipo] || '')) + '&ensp;' + msg;
      feedbackEl.style.display = 'flex';
    }

    function esconderFeedback() { feedbackEl.style.display = 'none'; }

    function atualizarProgresso(atual, total) {
      progressCont.style.display = 'block';
      progressBar.style.width = Math.round((atual / total) * 100) + '%';
    }

    function esconderProgresso() {
      progressCont.style.display = 'none';
      progressBar.style.width = '0%';
    }

    // ============================================================
    //  UPLOAD E DRAG-AND-DROP
    // ============================================================

    uploadBtn.addEventListener('click', (e) => { e.stopPropagation(); fileInput.click(); });
    uploadZone.addEventListener('click', () => fileInput.click());
    uploadZone.addEventListener('dragover', (e) => { e.preventDefault(); uploadZone.classList.add('drag-over'); });
    uploadZone.addEventListener('dragleave', () => { uploadZone.classList.remove('drag-over'); });
    uploadZone.addEventListener('drop', (e) => {
      e.preventDefault();
      uploadZone.classList.remove('drag-over');
      if (e.dataTransfer.files.length > 0) processarArquivo(e.dataTransfer.files[0]);
    });
    fileInput.addEventListener('change', () => {
      if (fileInput.files.length > 0) processarArquivo(fileInput.files[0]);
    });
    resetBtn.addEventListener('click', resetar);

    function resetar() {
      dadosRelatorio = null;
      fileInput.value = '';
      previewSection.classList.add('hidden');
      uploadZone.classList.remove('hidden');
      esconderFeedback();
      esconderProgresso();
      btnDia.disabled = true;
      btnProf.disabled = true;
      btnIndiv.disabled = true;
    }

    // ============================================================
    //  PROCESSAMENTO DO ARQUIVO .XLSX
    // ============================================================

    function processarArquivo(file) {
      if (!file.name.match(/\.xlsx?$/i)) {
        mostrarFeedback('Por favor, envie um arquivo .xlsx válido.', 'error');
        return;
      }
      mostrarFeedback('Lendo arquivo...', 'info');
      const reader = new FileReader();
      reader.onload = function (e) {
        try {
          const data = new Uint8Array(e.target.result);
          const workbook = XLSX.read(data, { type: 'array', raw: true });
          const sheetName = workbook.SheetNames[0];
          const sheet = workbook.Sheets[sheetName];
          const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: null, raw: true });
          dadosRelatorio = parsearPlanilha(rows);
          exibirPreview();
          esconderFeedback();
        } catch (err) {
          console.error(err);
          mostrarFeedback('Erro ao processar o arquivo: ' + err.message, 'error');
        }
      };
      reader.readAsArrayBuffer(file);
    }

    // ============================================================
    //  PARSING — extrai profissionais e plantões do .xlsx fonte
    // ============================================================

    function parsearPlanilha(rows) {
      // 1) Vigência da linha 3 (índice 2): "21/06/2026~20/07/2026"
      const vigenciaRaw = String(rows[2][0]).trim();
      const vigenciaParts = vigenciaRaw.split('~');
      const vigencia = {
        inicio: vigenciaParts[0].trim(),
        fim: vigenciaParts[1].trim(),
        raw: vigenciaRaw,
        curta: formatarVigenciaCurta(vigenciaRaw)
      };

      const profissionais = [];
      let profAtual = null;
      const regexProf = /^(.+?)\s{2}-\s{2}(\d+\/[A-Z]{2})$/;

      // 2) Iterar a partir da linha 5 (índice 4)
      for (let i = 4; i < rows.length; i++) {
        const row = rows[i];
        if (!row) continue;

        const colA = row[0] != null ? String(row[0]).trim() : null;
        const colB = row[1] != null ? String(row[1]).trim() : null;
        const colC = row[2] != null ? String(row[2]).trim() : null;
        const colD = row[3] != null ? String(row[3]).trim() : null;
        const colE = row[4] != null ? String(row[4]).trim() : null;
        const colF = row[5];

        // Parar no "Total Geral"
        if (colA === 'Total Geral') break;

        // Linha vazia
        if (!colA && !colB && !colC && !colD && !colE && colF == null) continue;

        // Linha de profissional
        if (colA && !colB && !colC) {
          const match = colA.match(regexProf);
          if (match) {
            if (profAtual) profissionais.push(profAtual);
            profAtual = {
              nome: match[1].trim(),
              crm: match[2].trim(),
              plantoes: [],
              totalPlantoes: 0,
              totalHoras: 0,   // agora em horas decimais
              totalValor: 0
            };
            continue;
          }
        }

        // Cabeçalho de colunas
        if (colA === 'Setor') continue;

        // Total do profissional
        if (colC === 'Total' && profAtual) {
          let somaValor = 0;
          let somaHoras = 0;
          profAtual.plantoes.forEach(p => {
            somaValor += p.valor;
            somaHoras += p.duracaoHoras;
          });
          profAtual.totalPlantoes = profAtual.plantoes.length;
          profAtual.totalHoras = somaHoras;
          profAtual.totalValor = somaValor;
          continue;
        }

        // Linha de plantão (colC = "DD/MM/AAAA HH:MM")
        if (colA && colB && colC && profAtual) {
          if (/^\d{2}\/\d{2}\/\d{4}\s\d{2}:\d{2}$/.test(colC)) {
            const valor = typeof colF === 'number' ? colF : parseInt(String(colF), 10) || 0;
            const duracaoStr = colE || '00:00';
            profAtual.plantoes.push({
              inicio: colC,
              fim: colD || '',
              duracaoStr: duracaoStr,
              duracaoHoras: duracaoParaHorasDecimal(duracaoStr),
              valor: valor
            });
          }
        }
      }

      // Último profissional
      if (profAtual) {
        if (profAtual.totalPlantoes === 0 && profAtual.plantoes.length > 0) {
          let somaValor = 0;
          let somaHoras = 0;
          profAtual.plantoes.forEach(p => {
            somaValor += p.valor;
            somaHoras += p.duracaoHoras;
          });
          profAtual.totalPlantoes = profAtual.plantoes.length;
          profAtual.totalHoras = somaHoras;
          profAtual.totalValor = somaValor;
        }
        profissionais.push(profAtual);
      }

      // 3) Totais gerais
      let totalGeralPlantoes = 0;
      let totalGeralHoras = 0;
      let totalGeralValor = 0;
      profissionais.forEach(p => {
        totalGeralPlantoes += p.totalPlantoes;
        totalGeralHoras += p.totalHoras;
        totalGeralValor += p.totalValor;
      });

      return {
        vigencia,
        profissionais,
        totalGeral: {
          plantoes: totalGeralPlantoes,
          horas: totalGeralHoras,
          valor: totalGeralValor
        }
      };
    }

    // ============================================================
    //  PREVIEW
    // ============================================================

    function exibirPreview() {
      const d = dadosRelatorio;
      document.getElementById('metVigencia').textContent = d.vigencia.curta;
      document.getElementById('metProfs').textContent = d.profissionais.length;
      document.getElementById('metPlantoes').textContent = d.totalGeral.plantoes;
      document.getElementById('metHoras').textContent = formatarTotalHoras(d.totalGeral.horas);
      document.getElementById('metValor').textContent = formatarMoeda(d.totalGeral.valor);

      const lista = document.getElementById('profList');
      lista.innerHTML = '';
      d.profissionais.forEach(p => {
        const li = document.createElement('li');
        li.textContent = p.nome + '  (' + p.crm + ')';
        lista.appendChild(li);
      });

      uploadZone.classList.add('hidden');
      previewSection.classList.remove('hidden');
      btnDia.disabled = false;
      btnProf.disabled = false;
      btnIndiv.disabled = false;
    }

    // ============================================================
    //  ESTILOS EXCELJS COMPARTILHADOS
    // ============================================================

    const ROXO_HEX = 'FF491E9C';
    const BORDA_FINA = {
      top:    { style: 'thin', color: { argb: 'FF000000' } },
      left:   { style: 'thin', color: { argb: 'FF000000' } },
      bottom: { style: 'thin', color: { argb: 'FF000000' } },
      right:  { style: 'thin', color: { argb: 'FF000000' } }
    };
    const FONT_HEADER_BRANCO = { bold: true, size: 12, color: { argb: 'FFFFFFFF' }, name: 'Calibri' };
    const FONT_COLUNA        = { bold: true, size: 12, color: { argb: 'FF000000' }, name: 'Calibri' };
    const FONT_DADO          = { bold: false, size: 12, color: { argb: 'FF000000' }, name: 'Calibri' };  // mudado para size 12
    const FONT_TOTAL_PRETO   = { bold: true, size: 12, color: { argb: 'FF000000' }, name: 'Calibri' };
    const FILL_ROXO          = { type: 'pattern', pattern: 'solid', fgColor: { argb: ROXO_HEX } };
    const NUMFMT_VALOR_DATA  = '"R$" #,##0.00';
    const NUMFMT_VALOR_TOTAL = '"R$" #,##0;[Red]-"R$" #,##0';

    /** Aplica borda fina + font em todas as colunas de uma row */
    function aplicarEstiloLinha(ws, rowNum, numCols, font) {
      for (let c = 1; c <= numCols; c++) {
        const cell = ws.getCell(rowNum, c);
        cell.font = font;
        cell.border = BORDA_FINA;
      }
    }

    // ============================================================
    //  OUTPUT 1: RELATÓRIO POR DIA (.xlsx)
    //  Colunas: Data | Profissional | Início | Fim | Duração (h) | Valor (R$)
    //  Com TOTAL por dia e TOTAL geral
    // ============================================================

    btnDia.addEventListener('click', gerarRelatorioPorDia);

    async function gerarRelatorioPorDia() {
      if (!dadosRelatorio) return;
      mostrarFeedback('Gerando relatório por dia...', 'info');
      btnDia.disabled = true; btnProf.disabled = true; btnIndiv.disabled = true;
      await new Promise(r => setTimeout(r, 50));

      try {
        const d = dadosRelatorio;
        const NUM_COLS = 6;

        // 1) Reunir todos os plantões
        const todosPlantoes = [];
        d.profissionais.forEach(prof => {
          prof.plantoes.forEach(pl => {
            todosPlantoes.push({
              data: extrairData(pl.inicio),
              profissional: prof.nome,
              inicio: pl.inicio,
              fim: pl.fim,
              duracaoHoras: pl.duracaoHoras,
              valor: pl.valor
            });
          });
        });

        // 2) Ordenar por data + profissional
        todosPlantoes.sort((a, b) => {
          const da = dataParaSort(a.data);
          const db = dataParaSort(b.data);
          if (da.getTime() !== db.getTime()) return da - db;
          return a.profissional.localeCompare(b.profissional, 'pt-BR');
        });

        // 3) Agrupar por data
        const gruposPorDia = {};
        const ordemDias = [];
        todosPlantoes.forEach(p => {
          if (!gruposPorDia[p.data]) {
            gruposPorDia[p.data] = [];
            ordemDias.push(p.data);
          }
          gruposPorDia[p.data].push(p);
        });

        // 4) Criar workbook
        const workbook = new ExcelJS.Workbook();
        const ws = workbook.addWorksheet('Relatório por Dia');

        // Larguras idênticas ao IDEAL
        ws.columns = [
          { key: 'A', width: 12.86 },
          { key: 'B', width: 35.86 },
          { key: 'C', width: 18.86 },
          { key: 'D', width: 13 },
          { key: 'E', width: 13.57 },
          { key: 'F', width: 14.86 }
        ];

        let totalGeralHoras = 0;
        let totalGeralValor = 0;

        // 5) Montar planilha
        ordemDias.forEach((dia, idx) => {
          const plantoesDia = gruposPorDia[dia];

          // --- Cabeçalho do dia: "DD/MM/AAAA:" merged A:F, roxo, branco bold, center ---
          const rowH = ws.addRow([dia + ':', '', '', '', '', '']);
          ws.mergeCells(rowH.number, 1, rowH.number, NUM_COLS);
          for (let c = 1; c <= NUM_COLS; c++) {
            const cell = ws.getCell(rowH.number, c);
            cell.font = FONT_HEADER_BRANCO;
            cell.fill = FILL_ROXO;
            cell.alignment = { horizontal: 'center', vertical: 'middle' };
          }

          // --- Cabeçalho de colunas: bold, bordas ---
          const rowC = ws.addRow(['Data', 'Profissional', 'Início', 'Fim', 'Duração (h)', 'Valor (R$)']);
          for (let c = 1; c <= NUM_COLS; c++) {
            const cell = ws.getCell(rowC.number, c);
            cell.font = FONT_COLUNA;
            cell.border = BORDA_FINA;
            if (c >= 5) cell.alignment = { horizontal: 'center' };
          }

          // --- Linhas de dados ---
          let somaHorasDia = 0;
          let somaValorDia = 0;

          plantoesDia.forEach(p => {
            const rowD = ws.addRow([p.data, p.profissional, p.inicio, p.fim, p.duracaoHoras, p.valor]);
            for (let c = 1; c <= NUM_COLS; c++) {
              const cell = ws.getCell(rowD.number, c);
              cell.font = FONT_DADO;
              cell.border = BORDA_FINA;
              if (c >= 5) cell.alignment = { horizontal: 'center' };
            }
            // Formato R$ na coluna Valor (F)
            ws.getCell(rowD.number, NUM_COLS).numFmt = NUMFMT_VALOR_DATA;

            somaHorasDia += p.duracaoHoras;
            somaValorDia += p.valor;
          });

          totalGeralHoras += somaHorasDia;
          totalGeralValor += somaValorDia;

          // --- TOTAL do dia: merged A:D, bordas, bold ---
          const rowT = ws.addRow(['TOTAL', '', '', '', formatarTotalHoras(somaHorasDia), somaValorDia]);
          ws.mergeCells(rowT.number, 1, rowT.number, 4);
          for (let c = 1; c <= NUM_COLS; c++) {
            const cell = ws.getCell(rowT.number, c);
            cell.font = FONT_TOTAL_PRETO;
            cell.border = BORDA_FINA;
            cell.alignment = { horizontal: 'center', vertical: 'middle' };
          }
          ws.getCell(rowT.number, NUM_COLS).numFmt = NUMFMT_VALOR_TOTAL;

          // Linha vazia separadora (exceto último grupo)
          if (idx < ordemDias.length - 1) {
            ws.addRow([]);
          }
        });

        // --- TOTAL GERAL: merged A:D, roxo, branco bold ---
        ws.addRow([]);
        const rowG = ws.addRow(['TOTAL:', '', '', '', formatarTotalHoras(totalGeralHoras), totalGeralValor]);
        ws.mergeCells(rowG.number, 1, rowG.number, 4);
        for (let c = 1; c <= NUM_COLS; c++) {
          const cell = ws.getCell(rowG.number, c);
          cell.font = FONT_HEADER_BRANCO;
          cell.fill = FILL_ROXO;
          cell.alignment = { horizontal: 'center', vertical: 'middle' };
        }
        ws.getCell(rowG.number, NUM_COLS).numFmt = NUMFMT_VALOR_TOTAL;

        // 6) Gerar e baixar
        const buffer = await workbook.xlsx.writeBuffer();
        const blob = new Blob([buffer], {
          type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
        });
        saveAs(blob, 'Relatório por dia - Clínica geral - ' + d.vigencia.curta + '.xlsx');
        mostrarFeedback('Relatório por dia gerado com sucesso!', 'success');
      } catch (err) {
        console.error(err);
        mostrarFeedback('Erro ao gerar relatório: ' + err.message, 'error');
      } finally {
        btnDia.disabled = false; btnProf.disabled = false; btnIndiv.disabled = false;
      }
    }

    // ============================================================
    //  OUTPUT 2: RELATÓRIO POR PROFISSIONAL (.xlsx)
    //  Colunas: Início | Fim | Duração (h) | Valor (R$)
    //  Com TOTAL por profissional e TOTAL geral
    // ============================================================

    btnProf.addEventListener('click', gerarRelatorioPorProfissional);

    async function gerarRelatorioPorProfissional() {
      if (!dadosRelatorio) return;
      mostrarFeedback('Gerando relatório por profissional...', 'info');
      btnDia.disabled = true; btnProf.disabled = true; btnIndiv.disabled = true;
      await new Promise(r => setTimeout(r, 50));

      try {
        const d = dadosRelatorio;
        const NUM_COLS = 4;

        const workbook = new ExcelJS.Workbook();
        const ws = workbook.addWorksheet('Relatório por Profissional');

        // Larguras idênticas ao IDEAL
        ws.columns = [
          { key: 'A', width: 19 },
          { key: 'B', width: 13 },
          { key: 'C', width: 13.86 },
          { key: 'D', width: 15 }
        ];

        let totalGeralHoras = 0;
        let totalGeralValor = 0;

        // Profissionais ordenados alfabeticamente
        const profsOrdenados = [...d.profissionais].sort((a, b) =>
          a.nome.localeCompare(b.nome, 'pt-BR')
        );

        profsOrdenados.forEach((prof, idx) => {
          // --- Cabeçalho do profissional: merged A:D, roxo, branco bold ---
          const nomeHeader = prof.nome + ' (' + prof.crm + '):';
          const rowH = ws.addRow([nomeHeader, '', '', '']);
          ws.mergeCells(rowH.number, 1, rowH.number, NUM_COLS);
          for (let c = 1; c <= NUM_COLS; c++) {
            const cell = ws.getCell(rowH.number, c);
            cell.font = FONT_HEADER_BRANCO;
            cell.fill = FILL_ROXO;
            cell.alignment = { vertical: 'middle' };
            if (c >= 3) cell.alignment = { horizontal: 'center', vertical: 'middle' };
          }

          // --- Cabeçalho de colunas: bold, bordas ---
          const rowC = ws.addRow(['Início', 'Fim', 'Duração (h)', 'Valor (R$)']);
          for (let c = 1; c <= NUM_COLS; c++) {
            const cell = ws.getCell(rowC.number, c);
            cell.font = FONT_COLUNA;
            cell.border = BORDA_FINA;
            if (c >= 3) cell.alignment = { horizontal: 'center' };
          }

          // --- Linhas de dados ---
          prof.plantoes.forEach(p => {
            const rowD = ws.addRow([p.inicio, p.fim, p.duracaoHoras, p.valor]);
            for (let c = 1; c <= NUM_COLS; c++) {
              const cell = ws.getCell(rowD.number, c);
              cell.font = FONT_DADO;
              cell.border = BORDA_FINA;
              if (c >= 3) cell.alignment = { horizontal: 'center' };
            }
            ws.getCell(rowD.number, NUM_COLS).numFmt = NUMFMT_VALOR_DATA;
          });

          totalGeralHoras += prof.totalHoras;
          totalGeralValor += prof.totalValor;

          // --- TOTAL do profissional: merged A:B, bold, bordas ---
          const rowT = ws.addRow(['TOTAL:', '', formatarTotalHoras(prof.totalHoras), prof.totalValor]);
          ws.mergeCells(rowT.number, 1, rowT.number, 2);
          for (let c = 1; c <= NUM_COLS; c++) {
            const cell = ws.getCell(rowT.number, c);
            cell.font = FONT_TOTAL_PRETO;
            cell.border = BORDA_FINA;
            cell.alignment = { horizontal: 'center', vertical: 'middle' };
          }
          ws.getCell(rowT.number, NUM_COLS).numFmt = NUMFMT_VALOR_TOTAL;

          // Linha vazia separadora (exceto último)
          if (idx < profsOrdenados.length - 1) {
            ws.addRow([]);
          }
        });

        // --- TOTAL GERAL: merged A:B, roxo, branco bold ---
        ws.addRow([]);
        const rowG = ws.addRow(['TOTAL:', '', formatarTotalHoras(totalGeralHoras), totalGeralValor]);
        ws.mergeCells(rowG.number, 1, rowG.number, 2);
        for (let c = 1; c <= NUM_COLS; c++) {
          const cell = ws.getCell(rowG.number, c);
          cell.font = FONT_HEADER_BRANCO;
          cell.fill = FILL_ROXO;
          cell.alignment = { horizontal: 'center', vertical: 'middle' };
        }
        ws.getCell(rowG.number, NUM_COLS).numFmt = NUMFMT_VALOR_TOTAL;

        // Gerar e baixar
        const buffer = await workbook.xlsx.writeBuffer();
        const blob = new Blob([buffer], {
          type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
        });
        saveAs(blob, 'Relatório por profissional - Clínica geral - ' + d.vigencia.curta + '.xlsx');
        mostrarFeedback('Relatório por profissional gerado com sucesso!', 'success');
      } catch (err) {
        console.error(err);
        mostrarFeedback('Erro ao gerar relatório: ' + err.message, 'error');
      } finally {
        btnDia.disabled = false; btnProf.disabled = false; btnIndiv.disabled = false;
      }
    }

    // ============================================================
    //  OUTPUT 3: RELATÓRIOS INDIVIDUAIS (ZIP de PDFs)
    //  Colunas: Início | Fim | Duração (h) | Valor (R$)
    //  Com TOTAL no final
    // ============================================================

    btnIndiv.addEventListener('click', gerarRelatoriosIndividuais);

    async function gerarRelatoriosIndividuais() {
      if (!dadosRelatorio) return;
      btnIndiv.disabled = true; btnDia.disabled = true; btnProf.disabled = true;
      const d = dadosRelatorio;
      const total = d.profissionais.length;
      mostrarFeedback('Gerando PDF 1 de ' + total + '...', 'info');
      atualizarProgresso(0, total);

      try {
        const zip = new JSZip();

        for (let i = 0; i < total; i++) {
          const prof = d.profissionais[i];
          mostrarFeedback('Gerando PDF ' + (i + 1) + ' de ' + total + ' — ' + prof.nome + '...', 'info');
          atualizarProgresso(i + 1, total);
          const pdfBlob = gerarPDFIndividual(prof, d.vigencia);
          const nomePDF = 'Relatório individual - Clínica geral - ' + prof.nome + ' - ' + d.vigencia.curta + '.pdf';
          zip.file(nomePDF, pdfBlob);
          await new Promise(r => setTimeout(r, 30));
        }

        mostrarFeedback('Compactando arquivos...', 'info');
        const zipBlob = await zip.generateAsync({
          type: 'blob', compression: 'DEFLATE', compressionOptions: { level: 6 }
        });
        saveAs(zipBlob, 'Relatórios individuais - Clínica geral - ' + d.vigencia.curta + '.zip');
        mostrarFeedback('Relatórios individuais gerados com sucesso! (' + total + ' PDFs)', 'success');
        esconderProgresso();
      } catch (err) {
        console.error(err);
        mostrarFeedback('Erro ao gerar relatórios: ' + err.message, 'error');
        esconderProgresso();
      } finally {
        btnIndiv.disabled = false; btnDia.disabled = false; btnProf.disabled = false;
      }
    }

    // ============================================================
    //  PDF INDIVIDUAL (jsPDF + AutoTable)
    //  4 colunas: Início | Fim | Duração (h) | Valor (R$)
    // ============================================================

    function gerarPDFIndividual(prof, vigencia) {
      if (!window.jspdf || !window.jspdf.jsPDF) {
        throw new Error('Biblioteca jsPDF não carregou. Recarregue a página e tente novamente.');
      }
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });

      const roxo = [73, 30, 156];
      const cinzaClaro = [245, 245, 247];
      const textoPrincipal = [26, 26, 46];
      const pageWidth = doc.internal.pageSize.getWidth();

      // --- CABEÇALHO ---
      doc.setFillColor(...roxo);
      doc.rect(0, 0, pageWidth, 18, 'F');
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(12);
      doc.setTextColor(255, 255, 255);
      doc.text('Relatório Individual de Plantões', 15, 8);
      doc.setFontSize(9);
      doc.setFont('helvetica', 'normal');
      doc.text('MediQuo — Clínica Geral', 15, 14);
      doc.setFontSize(8);
      doc.text('Vigência: ' + vigencia.inicio + ' a ' + vigencia.fim, pageWidth - 15, 8, { align: 'right' });

      // --- DADOS DO PROFISSIONAL ---
      doc.setTextColor(...textoPrincipal);
      doc.setFontSize(11);
      doc.setFont('helvetica', 'bold');
      doc.text(prof.nome, 15, 26);
      doc.setFontSize(8);
      doc.setFont('helvetica', 'normal');
      doc.setTextColor(107, 114, 128);
      doc.text('CRM: ' + prof.crm, 15, 31);

      // --- TABELA: 4 colunas (sem Setor e Tipo) ---
      const colunas = [
        { header: 'Início',      dataKey: 'inicio' },
        { header: 'Fim',         dataKey: 'fim' },
        { header: 'Duração (h)', dataKey: 'duracao' },
        { header: 'Valor (R$)',  dataKey: 'valor' }
      ];

      const linhas = prof.plantoes.map(p => ({
        inicio:  p.inicio,
        fim:     p.fim,
        duracao: p.duracaoHoras,
        valor:   formatarMoeda(p.valor)
      }));

      // Linha de total
      linhas.push({
        inicio:  'TOTAL:',
        fim:     '',
        duracao: formatarTotalHoras(prof.totalHoras),
        valor:   formatarMoeda(prof.totalValor)
      });

      const totalRowIndex = linhas.length - 1;

      doc.autoTable({
        columns: colunas,
        body: linhas,
        startY: 36,
        theme: 'grid',
        styles: {
          font: 'helvetica',
          fontSize: 7,
          cellPadding: { top: 1.2, right: 2, bottom: 1.2, left: 2 },
          lineColor: [180, 180, 180],
          lineWidth: 0.3,
          textColor: textoPrincipal
        },
        headStyles: {
          fillColor: roxo,
          textColor: [255, 255, 255],
          fontStyle: 'bold',
          fontSize: 7,
          cellPadding: { top: 1.5, right: 2, bottom: 1.5, left: 2 }
        },
        alternateRowStyles: {
          fillColor: cinzaClaro
        },
        columnStyles: {
          inicio:  { cellWidth: 55 },
          fim:     { cellWidth: 55 },
          duracao: { cellWidth: 35, halign: 'center' },
          valor:   { cellWidth: 45, halign: 'center' }
        },
        margin: { left: 15, right: 15 },
        didParseCell: function (data) {
          // Estilizar a linha de TOTAL
          if (data.section === 'body' && data.row.index === totalRowIndex) {
            data.cell.styles.fontStyle = 'bold';
            data.cell.styles.fillColor = cinzaClaro;
          }
        },
        didDrawPage: function (data) {
          const pageHeight = doc.internal.pageSize.getHeight();
          doc.setFontSize(7);
          doc.setTextColor(160, 160, 160);
          doc.text(
            'Página ' + doc.internal.getCurrentPageInfo().pageNumber,
            pageWidth - 15, pageHeight - 8, { align: 'right' }
          );
        }
      });

      // --- RODAPÉ ---
      const finalY = doc.lastAutoTable.finalY + 5;
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(7);
      doc.setTextColor(140, 140, 140);
      doc.text('Relatório gerado automaticamente — MediQuo / Pega Plantão', 15, finalY);

      return doc.output('blob');
    }

  })();
  </script>
